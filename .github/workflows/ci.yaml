name: ci workflow

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            -main

jobs:
    test:
        runs-on: ubuntu-latest


        steps:
        - name: checkout code
          uses: actions/checkout@v2
        - name: Set Up python
          uses: actions/setup-pyton@v2
          with:
            python-version: "3.14"
            
        - name: Install dependencies
          run:
            python -m pip install --upgrade pip
            pip install pytest streamlit

        - name: Run tests
          run:
            pytest _test.py
    
            
            